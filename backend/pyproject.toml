[project]
name = "local-interviewer-backend"
version = "0.1.0"
description = "Local-first voice interview simulator backend"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "aiosqlite>=0.20,<1",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5,<7",
  "reportlab>=4.2,<5",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
audio = ["numpy>=2,<3", "soundfile>=0.13,<1"]
stt-apple = ["mlx-whisper>=0.4"]
stt-portable = ["faster-whisper>=1.1,<2"]
tts-apple = ["kokoro-mlx>=0.1.4,<0.2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
